name: Daily price check

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC (8:17 AM Pakistan time)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write           # allows the workflow to save the database back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Download the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run the scraper
        run: python main.py

      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          git diff --staged --quiet || git commit -m "Update price data"
          git push